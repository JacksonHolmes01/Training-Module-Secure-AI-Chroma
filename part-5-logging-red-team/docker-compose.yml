# Fixed project name, so this lab's containers, volumes, and networks
# never collide with another lab that uses the same folder name.
name: secure-ai-chroma-part5

# Three networks, three trust zones:
#
#   frontend  nginx, gradio-ui, ingestion-api       (what you can reach)
#   backend   ingestion-api, chroma-gateway, ollama (the app's private zone)
#   data      chroma-gateway, chroma                (internal: no internet, no app access)
#
# Chroma has no security of its own, so ONLY its gateway can reach it.

services:
  # -------------------------------------------------------------------
  # Chroma: the knowledge store. No ports, isolated network.
  # -------------------------------------------------------------------
  chroma:
    image: chromadb/chroma:1.5.9
    container_name: rag-chroma
    restart: unless-stopped
    mem_limit: 2g
    cpus: 2.0
    pids_limit: 256
    command: ["run", "/config.yaml"]
    volumes:
      - chroma_data:/data
      - ./chroma/config.yaml:/config.yaml:ro
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8000"]
      interval: 5s
      timeout: 3s
      retries: 30
    networks:
      - data

  # -------------------------------------------------------------------
  # Chroma gateway: token auth + allowlist (same rules as Part 1)
  # -------------------------------------------------------------------
  chroma-gateway:
    image: nginx:1.28-alpine
    container_name: rag-chroma-gateway
    restart: unless-stopped
    mem_limit: 128m
    pids_limit: 64
    volumes:
      - ./chroma-gateway/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./secrets/tokens.map:/etc/nginx/secrets/tokens.map:ro
    depends_on:
      chroma:
        condition: service_healthy
    networks:
      - data
      - backend

  # -------------------------------------------------------------------
  # One-time setup: creates the tenant, database, and collection with
  # the admin token, then exits. The running app never holds admin.
  # -------------------------------------------------------------------
  chroma-init:
    image: curlimages/curl:8.11.1
    container_name: rag-chroma-init
    restart: "no"
    entrypoint: ["sh", "/init/init.sh"]
    environment:
      APP_TENANT: "${APP_TENANT:-lab}"
    volumes:
      - ./chroma-init:/init:ro
      - ./secrets/admin_token.txt:/run/secrets/admin_token:ro
    depends_on:
      chroma-gateway:
        condition: service_started
    networks:
      - backend

  # -------------------------------------------------------------------
  # Ollama: local LLM + embedding model
  # -------------------------------------------------------------------
  ollama:
    image: ollama/ollama:0.40.6
    container_name: rag-ollama
    restart: unless-stopped
    mem_limit: 6g
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - backend

  # -------------------------------------------------------------------
  # Ingestion + RAG API (FastAPI)
  # -------------------------------------------------------------------
  ingestion-api:
    build:
      context: ./ingestion-api
    container_name: rag-api
    restart: unless-stopped
    mem_limit: 1g
    environment:
      EDGE_API_KEY: "${EDGE_API_KEY:?Run bin/setup_secrets.sh first}"
      APP_TENANT: "${APP_TENANT:-lab}"
      CHROMA_URL: "http://chroma-gateway:8000"
      OLLAMA_BASE_URL: "http://ollama:11434"
      OLLAMA_MODEL: "${OLLAMA_MODEL:-llama3.2:1b}"
      OLLAMA_EMBED_MODEL: "${OLLAMA_EMBED_MODEL:-nomic-embed-text}"
      EMBED_DIM: "${EMBED_DIM:-768}"
      RAG_TOP_K: "${RAG_TOP_K:-4}"
      RAG_MAX_SOURCE_CHARS: "${RAG_MAX_SOURCE_CHARS:-1200}"
      ENABLE_DEBUG_ENDPOINTS: "${ENABLE_DEBUG_ENDPOINTS:-true}"
      OLLAMA_TEMPERATURE: "${OLLAMA_TEMPERATURE:-0}"
      # Prompt injection defenses (Part 3). Set in .env.
      GUARD_INPUT: "${GUARD_INPUT:-false}"
      GUARD_INGEST: "${GUARD_INGEST:-false}"
      GUARD_PROMPT: "${GUARD_PROMPT:-false}"
      PROMPT_SANITIZE: "${PROMPT_SANITIZE:-true}"
      GUARD_OUTPUT: "${GUARD_OUTPUT:-false}"
      ALLOWED_LINK_DOMAINS: "${ALLOWED_LINK_DOMAINS:-example.org}"
    volumes:
      # Only the two tokens this service needs. Never the admin token.
      - ./secrets/writer_token.txt:/run/secrets/writer_token:ro
      - ./secrets/reader_token.txt:/run/secrets/reader_token:ro
    depends_on:
      chroma-init:
        condition: service_completed_successfully
      ollama:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)"]
      interval: 10s
      timeout: 5s
      retries: 30
    networks:
      - backend
      - frontend

  # -------------------------------------------------------------------
  # NGINX edge gateway: the only way into the API
  # -------------------------------------------------------------------
  nginx:
    image: nginx:1.28-alpine
    container_name: rag-nginx
    restart: unless-stopped
    mem_limit: 128m
    ports:
      - "127.0.0.1:8088:8088"
    environment:
      EDGE_API_KEY: "${EDGE_API_KEY:?Run bin/setup_secrets.sh first}"
    volumes:
      - ./nginx/templates:/etc/nginx/templates:ro
    depends_on:
      ingestion-api:
        condition: service_healthy
    networks:
      - frontend

  # -------------------------------------------------------------------
  # Gradio chat UI
  # -------------------------------------------------------------------
  gradio-ui:
    build:
      context: ./gradio-ui
    container_name: rag-ui
    restart: unless-stopped
    mem_limit: 512m
    ports:
      - "127.0.0.1:7860:7860"
    environment:
      API_BASE_URL: "http://nginx:8088"
      EDGE_API_KEY: "${EDGE_API_KEY:?Run bin/setup_secrets.sh first}"
      GRADIO_HTTP_TIMEOUT_S: "${GRADIO_HTTP_TIMEOUT_S:-600}"
    depends_on:
      nginx:
        condition: service_started
    networks:
      - frontend

networks:
  frontend:
    driver: bridge
  backend:
    driver: bridge
  data:
    driver: bridge
    internal: true

volumes:
  chroma_data:
  # Reuse the models you downloaded in Part 2 instead of downloading again.
  # bin/setup_secrets.sh creates this volume if it does not exist yet.
  ollama_data:
    name: secure-ai-chroma-part2_ollama_data
    external: true

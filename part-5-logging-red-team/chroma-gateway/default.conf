# Internal Chroma gateway (same security model as Part 1)
#
# Listens only on the private "backend" network, so it uses plain HTTP.
# Every request still needs a token, and each token may only do what
# the allowlist permits, only inside its own tenant.

map_hash_bucket_size 128;

# Token -> "role:tenant". Generated by bin/setup_secrets.sh, never committed.
map $http_authorization $role {
    default "";
    include /etc/nginx/secrets/tokens.map;
}

# Allowlist: anything not listed is denied.
map "$role:$request_method:$uri" $allowed {
    default 0;

    "~^admin:"                                                                                  1;

    "~^(reader|writer):[a-z0-9_-]+:GET:/api/v2/(heartbeat|version|healthcheck|auth/identity|pre-flight-checks)$" 1;

    "~^(reader|writer):([a-z0-9_-]+):GET:/api/v2/tenants/\2(/databases/main(/collections(/[^/]+(/count)?)?|/collections_count)?)?$" 1;

    "~^(reader|writer):([a-z0-9_-]+):POST:/api/v2/tenants/\2/databases/main/collections/[^/]+/(query|get)$" 1;

    # Writer may add records. It may NOT create or delete collections:
    # in Part 2 the collection is created once by chroma-init (admin).
    "~^writer:([a-z0-9_-]+):POST:/api/v2/tenants/\1/databases/main/collections/[^/]+/add$"     1;
}

# Part 5: one JSON line per request. Records the ROLE the token mapped to
# (for example "reader:lab", or empty for an invalid token), never the token.
log_format json_gateway escape=json
  '{"time":"$time_iso8601","source":"gateway","ip":"$remote_addr",'
  '"method":"$request_method","path":"$uri","status":$status,"role":"$role"}';

server {
    access_log /dev/stdout json_gateway;
    listen 8000;
    server_tokens off;
    client_max_body_size 2m;
    default_type application/json;

    if ($request_uri ~* "(\.\.|//|%2e|%2f|%5c)") {
        return 400 '{"error":"invalid path"}\n';
    }

    location / {
        if ($http_authorization = "") {
            return 401 '{"error":"missing Authorization: Bearer token"}\n';
        }
        if ($role = "") {
            return 403 '{"error":"invalid token"}\n';
        }
        if ($allowed = 0) {
            return 403 '{"error":"this token is not allowed to do that"}\n';
        }

        proxy_set_header Authorization "";
        proxy_set_header Host $host;
        proxy_pass http://chroma:8000;
    }
}

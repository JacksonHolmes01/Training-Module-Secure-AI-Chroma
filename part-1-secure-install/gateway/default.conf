# Chroma security gateway
#
# Chroma has no authentication or permissions of its own, so this file is
# where every access-control decision is made:
#
#   1. TLS: only encrypted HTTPS connections are accepted
#   2. Authentication: the Bearer token decides WHO you are   ($role)
#   3. Authorization: an allowlist decides WHAT you may do    ($allowed)
#   4. Tenant isolation: each token is locked to one tenant
#   5. Rate limiting and body size limits

# -------------------------------------------------------------------
# 2. Authentication: token -> "role:tenant"
#    The token list is generated by bin/setup_secrets.sh and is never
#    committed to git. Unknown or missing tokens get an empty role.
# -------------------------------------------------------------------
# Tokens are long, so the lookup table needs bigger buckets than the default
map_hash_bucket_size 128;

map $http_authorization $role {
    default "";
    include /etc/nginx/secrets/tokens.map;
}

# -------------------------------------------------------------------
# 3 + 4. Authorization allowlist
#    Input looks like:  reader:acme:POST:/api/v2/tenants/acme/databases/main/collections/<id>/query
#    \2 means "the same tenant name that appears in the role", so a token
#    for acme can only ever touch paths under /tenants/acme/.
#    Anything not listed here is denied.
# -------------------------------------------------------------------
map "$role:$request_method:$uri" $allowed {
    default 0;

    # Admin can do everything (create tenants, delete collections, ...)
    "~^admin:"                                                                                  1;

    # Any valid token: health and identity checks
    "~^(reader|writer):[a-z0-9_-]+:GET:/api/v2/(heartbeat|version|healthcheck|auth/identity|pre-flight-checks)$" 1;

    # Reader and writer: look up their own tenant, database, and collections
    "~^(reader|writer):([a-z0-9_-]+):GET:/api/v2/tenants/\2(/databases/main(/collections(/[^/]+(/count)?)?|/collections_count)?)?$" 1;

    # Reader and writer: search and fetch records
    "~^(reader|writer):([a-z0-9_-]+):POST:/api/v2/tenants/\2/databases/main/collections/[^/]+/(query|get)$" 1;

    # Writer only: create collections and add records
    "~^writer:([a-z0-9_-]+):POST:/api/v2/tenants/\1/databases/main/collections$"                1;
    "~^writer:([a-z0-9_-]+):POST:/api/v2/tenants/\1/databases/main/collections/[^/]+/(add|upsert)$" 1;
}

# 5. At most 20 requests per second per client, short bursts of 40
limit_req_zone $binary_remote_addr zone=chroma_limit:10m rate=20r/s;

server {
    # 1. TLS only
    listen 8443 ssl;
    http2 on;
    ssl_certificate     /etc/nginx/secrets/server.crt;
    ssl_certificate_key /etc/nginx/secrets/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    server_tokens off;
    client_max_body_size 1m;
    default_type application/json;

    # Block path tricks before any decision is made: "..", "//", and
    # percent-encoded slashes or dots can make a path look different to
    # the gateway than to Chroma.
    if ($request_uri ~* "(\.\.|//|%2e|%2f|%5c)") {
        return 400 '{"error":"invalid path"}\n';
    }

    location / {
        if ($http_authorization = "") {
            return 401 '{"error":"missing Authorization: Bearer token"}\n';
        }
        if ($role = "") {
            return 403 '{"error":"invalid token"}\n';
        }
        if ($allowed = 0) {
            return 403 '{"error":"this token is not allowed to do that"}\n';
        }

        limit_req zone=chroma_limit burst=40 nodelay;
        limit_req_status 429;

        # Chroma never sees the client's token
        proxy_set_header Authorization "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_pass http://chroma:8000;
    }
}

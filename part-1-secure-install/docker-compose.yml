# Fixed project name, so this lab's containers, volumes, and networks
# never collide with another lab that uses the same folder name.
name: secure-ai-chroma-part1

services:
  # -------------------------------------------------------------------
  # Chroma: the vector database
  # Chroma's open-source server has NO authentication of its own, so it
  # gets no published port. The only way in is through the gateway.
  # -------------------------------------------------------------------
  chroma:
    image: chromadb/chroma:1.5.9
    container_name: chroma
    restart: unless-stopped
    mem_limit: 2g
    cpus: 2.0
    pids_limit: 256
    command: ["run", "/config.yaml"]
    volumes:
      - chroma_data:/data
      - ./chroma/config.yaml:/config.yaml:ro
    networks:
      - data

  # -------------------------------------------------------------------
  # Gateway: TLS, token authentication, route allowlist, rate limiting
  # -------------------------------------------------------------------
  gateway:
    image: nginx:1.28-alpine
    container_name: chroma-gateway
    restart: unless-stopped
    mem_limit: 128m
    pids_limit: 64
    ports:
      - "127.0.0.1:8443:8443"
    volumes:
      - ./gateway/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./secrets/tokens.map:/etc/nginx/secrets/tokens.map:ro
      - ./secrets/server.crt:/etc/nginx/secrets/server.crt:ro
      - ./secrets/server.key:/etc/nginx/secrets/server.key:ro
    depends_on:
      - chroma
    networks:
      - data

networks:
  data:
    driver: bridge

volumes:
  chroma_data:
